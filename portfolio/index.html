/* ---------------- статические тексты ---------------- */
function applyStatic(){
  const u = L();
  document.documentElement.lang = LANG;
  document.title = u.title;
  const set=(id,v)=>{document.getElementById(id).textContent=v};
  set("i-logo",u.logo); set("i-contact",u.contact); set("i-badge",u.badge);
  set("i-kick",u.kick); set("i-h1",u.h1); set("i-role",u.role); set("i-lead",u.lead);
  set("i-riverbtn",u.riverbtn);
  document.getElementById("i-stats").innerHTML =
    u.stats.map(([n,l])=>`<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  set("i-rivh2",u.rivh2); set("i-rivp",u.rivp);
  set("i-cardh2",u.cardh2); set("i-cardp",u.cardp); set("i-prebox",u.prebox);
  set("i-fbig",u.fbig); set("i-fdim",u.fdim);
  set("i-skh2",u.skh2); set("i-skp",u.skp);
  document.getElementById("skillgrid").innerHTML = SKILLS.map(g=>
    `<div class="skg"><h3><i style="background:${g.c}"></i>${T(g.t)}</h3>
     <div class="chips">${g.items.map(it=>`<span${it.hot?' class="hot"':''}>${T(it)}</span>`).join("")}</div></div>`).join("");
  set("i-gxlink",u.gxlink);
  document.querySelectorAll("#langsw button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  applyCollapse();
}

/* ---------------- сворачивание реки ---------------- */
function applyCollapse(){
  const c = localStorage.getItem("pf-riv") !== "1";   // по умолчанию свернуто
  document.getElementById("riverbox").style.display = c ? "none" : "";
  document.getElementById("legend").style.display = c ? "none" : "";
  document.getElementById("rivtoggle").textContent = c ? L().expand : L().collapse;
}
document.getElementById("rivtoggle").addEventListener("click", ()=>{
  const c = localStorage.getItem("pf-riv") !== "1";
  localStorage.setItem("pf-riv", c ? "1" : "0");
  applyCollapse();
});
document.querySelectorAll('a[href="#river"]').forEach(a=>a.addEventListener("click", ()=>{
  localStorage.setItem("pf-riv", "1"); applyCollapse();
}));

const N = R.months.length, H = N*MH + 40;
const TICKS = MOB ? 46 : 64;
const idx = Object.fromEntries(R.months.map((m,i)=>[m.ym,i]));
const yOf = ym => (idx[ym] ?? 0)*MH + MH/2 + 20;

const chrono = R.streams.slice().sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));
const laneEnd = [];
chrono.forEach(s=>{
  let l = laneEnd.findIndex(e=>e < s.start);
  if(l<0){l = laneEnd.length; laneEnd.push("");}
  laneEnd[l] = s.end; s.lane = l;
});
const NL = laneEnd.length;
const RIVW = MOB ? (W-TICKS-10) : Math.min(440, W*0.40);
const GAP = 8, LW = Math.floor((RIVW-(NL-1)*GAP)/NL);
const laneX = l => TICKS + 14 + l*(LW+GAP) + LW/2;
const riverRight = TICKS + 14 + NL*(LW+GAP);
const EVX = MOB ? TICKS+10 : riverRight + 36;
const EVW = MOB ? W-TICKS-20 : W - EVX;

const wOf = {};
R.months.forEach(m=>m.active.forEach(a=>{ (wOf[a.id]=wOf[a.id]||{})[m.ym]=Math.max(3,a.w*LW); }));

/* ---------------- рендер (перерисовывается при смене языка) ---------------- */
const svg = d3.select("#riv").attr("width",W);
const evbox = document.getElementById("events");
const cbox = document.getElementById("cards");
const lg = document.getElementById("legend");
const area = d3.area().y(d=>d.y).x0(d=>d.x-d.w/2).x1(d=>d.x+d.w/2).curve(d3.curveBasis);

function render(){
  const u = L();
  svg.selectAll("*").remove(); evbox.innerHTML=""; cbox.innerHTML=""; lg.innerHTML="";

  /* легенда */
  Object.entries(u.kinds).forEach(([k,l])=>lg.insertAdjacentHTML("beforeend",
    `<span><i style="background:${KINDC[k]}"></i>${l}</span>`));
  lg.insertAdjacentHTML("beforeend",
    `<span><i style="background:transparent;border:1px dashed #44566c"></i>${u.widthnote}</span>`);

  /* фон: линии месяцев, тики, годы */
  const g0 = svg.append("g");
  R.months.forEach((m,i)=>{
    const [y,mo] = m.ym.split("-").map(Number), Y = i*MH+20;
    const jan = mo===1, first = m.ym===R.start;
    g0.append("line").attr("x1",TICKS).attr("x2",MOB?W:riverRight+16).attr("y1",Y).attr("y2",Y)
      .attr("stroke", jan?"#2c3a4c":"#161e29").attr("stroke-width",jan?1.5:1);
    if(jan||first) g0.append("text").attr("x",6).attr("y",Y+(jan?-6:16)).attr("font-size",17)
      .attr("font-weight",800).attr("fill","#8fa6c4").text(y);
    g0.append("text").attr("x",TICKS-8).attr("y",Y+MH/2+4).attr("text-anchor","end")
      .attr("font-size",10.5).attr("fill", mo===1?"#7e93ad":"#44566c").text(u.mon[mo-1]);
  });
  svg.append("text").attr("x",TICKS+14).attr("y",12).attr("font-size",12).attr("font-weight",700)
    .attr("fill","#7ee0c0").text(u.now);
  svg.append("text").attr("x",TICKS+14).attr("y",H-6).attr("font-size",12).attr("font-weight",700)
    .attr("fill","#8fa6c4").text(u.source);

  /* ленты */
  R.streams.forEach(s=>{
    const ms = R.months.filter(m=>wOf[s.id]?.[m.ym]);
    if(!ms.length) return;
    const x = laneX(s.lane);
    const pts = ms.map(m=>({y:yOf(m.ym), x, w:wOf[s.id][m.ym]}));
    pts.unshift({y:pts[0].y-MH*0.45, x, w:Math.max(2,pts[0].w*0.25)});
    pts.push({y:pts[pts.length-1].y+MH*0.45, x, w:Math.max(2,pts[pts.length-1].w*0.25)});
    svg.append("path").attr("d",area(pts)).attr("fill",COLOR[s.id]||"#888").attr("opacity",.88)
      .style("cursor","pointer").on("click",()=>showCard(s.id))
      .append("title").text(T(s.name));
    const spanPx = pts[pts.length-1].y-pts[0].y;
    const label = T(s.short)||T(s.name);
    const vlabel = (yy,op)=>{
      svg.append("text").attr("transform",`translate(${x+4},${yy}) rotate(90)`)
        .attr("font-size",11.5).attr("font-weight",700).attr("fill","#0e1117").attr("opacity",op)
        .attr("paint-order","stroke").attr("stroke","rgba(255,255,255,.5)").attr("stroke-width",2.5)
        .style("cursor","pointer").text(label).on("click",()=>showCard(s.id));
    };
    if(spanPx > 90){
      vlabel(pts[0].y+18, 1);
      for(let yy=pts[0].y+720; yy<pts[pts.length-1].y-110; yy+=720) vlabel(yy, .75);
    } else {
      svg.append("text").attr("x",x+LW/2+5).attr("y",pts[0].y+10).attr("font-size",11)
        .attr("font-weight",700).attr("fill",COLOR[s.id]).style("cursor","pointer")
        .text(label).on("click",()=>showCard(s.id));
    }
  });

  /* события */
  let lastBottom = 0;
  const evs = [...R.events].sort((a,b)=> (idx[a.ym]??0)-(idx[b.ym]??0));
  evs.forEach(e=>{
    const y = yOf(e.ym), c = e.stream? (COLOR[e.stream]||"#5b9dff") : "#5b9dff";
    const el = document.createElement("div");
    el.className = "ev "+e.type;
    const [yy,mm] = e.ym.split("-").map(Number);
    const tag = u.types[e.type] ? ` · <b>${u.types[e.type]}</b>` : "";
    el.innerHTML = `<div class="d">${u.mon[mm-1]} ${yy}${tag}</div>${T(e.text)}`;
    el.style.cssText = `left:${EVX}px;width:${EVW}px;--c:${c}`;
    evbox.appendChild(el);
    const top = Math.max(y-14, lastBottom+6);
    el.style.top = top+"px"; lastBottom = top + el.offsetHeight;
    if(!MOB){
      const x1 = e.stream && SD[e.stream] ? laneX(SD[e.stream].lane) : riverRight;
      /* диагональ: точка месяца на ленте -> середина карточки */
      svg.append("line").attr("x1",x1+6).attr("y1",y).attr("x2",EVX-3)
        .attr("y2",top+el.offsetHeight/2)
        .attr("stroke","#3d5068").attr("stroke-width",1.5).attr("stroke-dasharray","3 4");
      const dot = document.createElement("div"); dot.className="evdot";
      dot.style.cssText = `left:${x1-4.5}px;top:${y-4.5}px;background:${c}`;
      evbox.appendChild(dot);
    }
  });
  const totalH = Math.max(H, lastBottom+30);
  svg.attr("height", totalH); box.style.height = totalH+"px";

  /* карточки */
  const order = R.streams.slice().sort((a,b)=>b.end.localeCompare(a.end)||b.start.localeCompare(a.start));
  order.forEach(s=>{
    const c = s.card; if(!c) return;
    const el = document.createElement("div");
    el.className="pcard"; el.id = "c-"+s.id;
    el.innerHTML = `<div class="top"><span class="dot" style="background:${COLOR[s.id]}"></span>
        <h3>${T(s.name)}</h3><span class="kind" style="background:${KINDC[s.kind]}">${u.kinds[s.kind]}</span></div>
      <div class="meta"><b>${T(c.period)}</b> · ${T(c.geo)}</div>
      <div class="sum">${T(c.summary)}</div>
      <ul>${c.projects.map(p=>`<li>${T(p)}</li>`).join("")}</ul>
      <div class="tech">${c.tech.map(t=>`<span>${T(t)}</span>`).join("")}</div>`;
    cbox.appendChild(el);
  });
}

function showCard(id){
  const el = document.getElementById("c-"+id); if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1600);
}

/* ---------------- ховер: занятость месяца ---------------- */
const tip = document.getElementById("tip"), band = document.getElementById("hoverband");
box.addEventListener("mousemove",ev=>{
  const r = box.getBoundingClientRect(), y = ev.clientY - r.top, x = ev.clientX - r.left;
  const i = Math.floor((y-20)/MH);
  if(i<0||i>=N||(!MOB&&x>EVX-10)){tip.style.opacity=0;band.style.opacity=0;return;}
  const m = R.months[i];
  if(!m){tip.style.opacity=0;band.style.opacity=0;return;}
  const [yy,mm] = m.ym.split("-").map(Number);
  const act = m.active.slice().sort((a,b)=>b.w-a.w);
  tip.innerHTML = `<div class="m">${L().mon[mm-1]} ${yy}</div>`+
    (act.length? `<ul>${act.map(a=>`<li><i style="background:${COLOR[a.id]}"></i>${T(SD[a.id].name)}</li>`).join("")}</ul>`
               : `<span style="color:var(--dim)">—</span>`);
  tip.style.opacity = 1;
  tip.style.left = Math.min(x+18, W-320)+"px";
  tip.style.top = (i*MH+20+MH+4)+"px";
  band.style.top = (i*MH+20)+"px"; band.style.height = MH+"px"; band.style.opacity = 1;
});
box.addEventListener("mouseleave",()=>{tip.style.opacity=0;band.style.opacity=0;});

/* ---------------- бейдж года ---------------- */
const badge = document.getElementById("yearbadge"), bb = badge.querySelector("b");
let bv = "";
addEventListener("scroll",()=>{
  const r = box.getBoundingClientRect();
  if(r.top < innerHeight*0.4 && r.bottom > innerHeight*0.4){
    const i = Math.min(N-1, Math.max(0, Math.floor((innerHeight*0.4 - r.top - 20)/MH)));
    const [yy,mm] = R.months[i].ym.split("-");
    const v = `${L().mon[+mm-1]} ${yy}`;
    if(v!==bv){bb.textContent=v;bv=v;}
    badge.style.opacity = 1;
  } else badge.style.opacity = 0;
},{passive:true});

/* ---------------- переключатель языка ---------------- */
document.querySelectorAll("#langsw button").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.l===LANG) return;
  LANG = b.dataset.l; localStorage.setItem("pf-lang",LANG);
  applyStatic(); render();
}));

applyStatic(); render();
</script>
</body>
</html>
